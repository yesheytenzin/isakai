name: Isakai checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Host dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libpulse-dev libsqlite3-dev libicu-dev libfontconfig1 libfreetype6 fonts-noto-core fonts-noto-cjk unzip
      - name: Pinned toolchain
        run: python3 tools/bootstrap.py
      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          source .cache/toolchain/env.sh
          ISAKAI_CHECK_LOG_DIR=.cache/isakai/ci tools/checks.sh core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checks
          path: .cache/isakai/ci
  privileged-wayland:
    runs-on: [self-hosted, linux, x64, isakai-wayland]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and required privileged gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap.py
          source .cache/toolchain/env.sh
          zig build
          mkdir -p .cache/isakai/ci
          python3 verify-isakai/check-navigation.py 2>&1 | tee .cache/isakai/ci/navigation.log
          python3 verify-isakai/check-harness-failure.py 2>&1 | tee .cache/isakai/ci/harness-failure.log
          tools/e2e-privileged.sh --required
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: privileged-wayland
          path: |
            /tmp/isakai-e2e-*
            .cache/isakai/ci
            .cache/isakai/evidence/navigation-*.png
