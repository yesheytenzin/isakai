# Isakai's copy of ATL bionic_translation's override map.
# Android soname -> host/ATL provider for the libraries this runtime ships.
libc.so             libc_bio.so.0
libstdc++.so        libstdc++_bio.so.0
# ATL has no libm_bio; the loader resolves this name through
# BIONIC_LD_LIBRARY_PATH, which the shim extends with glibc's libm dir.
libm.so             libm.so.6
libandroid.so       libisakai_jni.so
